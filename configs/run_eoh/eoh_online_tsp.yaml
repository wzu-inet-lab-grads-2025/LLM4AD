online_run:  # 纯在线方法总配置，可通过 method.name 切换 eoh、funsearch、mcts_ahd、reevo
  llm_mode: online  # 固定为在线模型模式，禁止混入本地 RL/SFT/LoRA 字段
  online_model_config_dir: configs/run_eoh/online_models  # 在线模型配置目录，相对项目根目录解析
  online_model:  # 当前使用的在线模型选择
    name: volcengine  # 在线模型配置名，默认使用火山方舟编码模型，可改为 deepseek 或 aliyun
    overrides: {}  # 可选覆盖项，例如覆盖 model、generation.max_tokens 等
  method:  # 在线搜索方法配置，修改 name 和 params 即可切换方法
    name: eoh  # 默认使用 EoH，可改为 funsearch、mcts_ahd 或 reevo
    params:  # 当前方法构造参数，字段会原样传给对应方法类
      max_generations: 500  # EoH 最大进化代数，到达后停止
      max_sample_nums: 200  # 最大评估样本数，到达后停止
      pop_size: 10  # 活跃种群大小，可被当前 scale 的 pop_size 覆盖
      selection_num: 2  # EoH/MCTS_AHD 父代选择数量
      use_e2_operator: true  # EoH 是否启用 E2 组合算子
      use_m1_operator: true  # EoH 是否启用 M1 变异算子
      use_m2_operator: true  # EoH 是否启用 M2 变异算子
      num_samplers: 1  # 在线模型并行采样线程数，在线 API 建议先保持 1
      num_evaluators: 4  # 候选程序并行评估 worker 数
      multi_thread_or_process_eval: thread  # 评估执行器类型，可选 thread 或 process
      debug_mode: false  # 是否开启调试模式，开启后异常会直接抛出
  logging:  # 运行日志配置
    log_base_dir: /home/yuanyilun/projects/source/LLM4AD/logs  # 日志根目录，最终写入 logs/TSP/{method}_online
    allow_existing_run_dir: false  # 是否允许复用已存在的 run 目录，默认不复用避免覆盖
  tsp:  # TSP 任务配置
    task_name: tsp_construct  # 任务注册名，必须与 TSP evaluator 保持一致
    default_scale: small  # 默认运行规模
    params:  # 默认任务参数说明，不直接参与构造，实际以 scales 中 default_scale 为准
      problem_size: 50  # TSP 节点数量
      n_instance: 64  # 评估实例数量
      timeout_seconds: 30  # 单个候选程序评估超时时间秒数
    scales:  # 可选任务规模集合
      small:  # small 规模配置
        problem_size: 50  # TSP 节点数量
        n_instance: 64  # 评估实例数量
        timeout_seconds: 30  # 单个候选程序评估超时时间秒数
        pop_size: 10  # 该规模下覆盖 method.params.pop_size 的种群大小
      medium-100:  # medium-100 规模配置
        problem_size: 100  # TSP 节点数量
        n_instance: 64  # 评估实例数量
        timeout_seconds: 30  # 单个候选程序评估超时时间秒数
        pop_size: 10  # 该规模下覆盖 method.params.pop_size 的种群大小
      medium-200:  # medium-200 规模配置
        problem_size: 200  # TSP 节点数量
        n_instance: 64  # 评估实例数量
        timeout_seconds: 30  # 单个候选程序评估超时时间秒数
        pop_size: 10  # 该规模下覆盖 method.params.pop_size 的种群大小
